<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}CharClamp{% endblock %} · 炭窑焖烧志</title>
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-block">
        <span class="ember"></span>
        <div>
          <strong>CharClamp</strong>
          <small>{% block site_label %}乌石岗焖烧坞{% endblock %}</small>
        </div>
      </div>
      <div class="topbar-actions">
        {% block top_actions %}{% endblock %}
        {% if user %}
        <a class="link-quiet" href="/logout">退出 {{ user.username }}</a>
        {% endif %}
      </div>
    </header>

    {% if flash %}
    <div class="flash flash-{{ flash_cat or 'ok' }}" id="flash">{{ flash }}</div>
    {% endif %}

    <div class="stage">
      {% block content %}{% endblock %}
    </div>
  </div>

  <div id="drawer-root" class="drawer-root" aria-live="polite"></div>
  <div
    id="drawer-backdrop"
    class="drawer-backdrop"
    hx-on:click="document.getElementById('drawer-root').innerHTML=''; this.classList.remove('open')"
  ></div>
  <script>
    document.body.addEventListener('htmx:afterSwap', function (evt) {
      if (evt.detail.target && evt.detail.target.id === 'drawer-root') {
        document.getElementById('drawer-backdrop').classList.add('open');
        document.getElementById('drawer-root').classList.add('open');
      }
    });
    function closeDrawer() {
      document.getElementById('drawer-root').innerHTML = '';
      document.getElementById('drawer-root').classList.remove('open');
      document.getElementById('drawer-backdrop').classList.remove('open');
    }

    // 班次开始时间窗：抽屉即时校验与保存后拦截共用同一句中文。
    function enforceShiftWindow(form) {
      var input = form.querySelector('[data-window-input]');
      var message = form.getAttribute('data-window-message');
      if (!input) return true;
      if (!input.value) { input.setCustomValidity(''); return true; }
      if (input.validity.rangeUnderflow || input.validity.rangeOverflow) {
        input.setCustomValidity(message);
        return false;
      }
      input.setCustomValidity('');
      return true;
    }
    document.addEventListener('input', function (evt) {
      var input = evt.target.closest && evt.target.closest('[data-window-input]');
      if (input) enforceShiftWindow(input.closest('[data-shift-window-form]'));
    });
    document.addEventListener('change', function (evt) {
      var select = evt.target.closest && evt.target.closest('[data-clamp-min]');
      if (!select) return;
      var form = select.closest('[data-shift-window-form]');
      var input = form.querySelector('[data-window-input]');
      var mins = JSON.parse(select.getAttribute('data-clamp-min') || '{}');
      var bound = mins[select.value];
      if (bound) { input.setAttribute('min', bound); } else { input.removeAttribute('min'); }
      enforceShiftWindow(form);
    });
    document.addEventListener('submit', function (evt) {
      var form = evt.target.closest && evt.target.closest('[data-shift-window-form]');
      if (form && !enforceShiftWindow(form)) {
        evt.preventDefault();
        form.querySelector('[data-window-input]').reportValidity();
      }
    }, true);
  </script>
</body>
</html>
