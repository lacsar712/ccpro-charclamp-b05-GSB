<aside class="drawer" role="dialog" aria-label="{% if mode == 'edit' %}改写焖烧班次{% else %}登记焖烧班次{% endif %}">
  <header class="drawer-head">
    <h2>{% if mode == 'edit' %}改写焖烧班次{% else %}登记焖烧班次{% endif %}</h2>
    <button type="button" class="icon-close" onclick="closeDrawer()" aria-label="关闭">×</button>
  </header>
  <form
    class="drawer-body"
    method="post"
    action="{% if mode == 'edit' %}/shifts/{{ shift_id }}/edit{% else %}/shifts/new{% endif %}"
    data-shift-window-form
    data-window-message="{{ shift_window_message }}"
  >
    <label>炭窑
      {% if mode == 'edit' %}
      <input type="text" value="{{ shift.clamp.code }}" disabled />
      {% else %}
      <select name="clamp_id" required data-clamp-min='{{ clamp_min_values | tojson }}'>
        {% for clamp in clamps %}
        <option value="{{ clamp.id }}" {% if preselect_clamp_id == clamp.id %}selected{% endif %}>{{ clamp.code }}</option>
        {% endfor %}
      </select>
      {% endif %}
    </label>
    <label>开始时间
      <input
        name="started_at"
        type="datetime-local"
        {% if min_started_at %}min="{{ min_started_at }}"{% endif %}
        max="{{ max_started_at }}"
        value="{{ started_at_value }}"
        data-window-input
      />
    </label>
    <label>峰值温度 ℃（可空）
      <input name="peak_temp_c" type="number" step="0.1" value="{{ peak_value }}" />
    </label>
    <label>炭品等级
      <input name="charcoal_grade" value="{{ grade_value }}" />
    </label>
    <label>备注
      <textarea name="notes" rows="3">{{ notes_value }}</textarea>
    </label>
    <p class="hint" data-window-hint>{{ shift_window_message }}</p>
    <div class="actions">
      <button type="submit">{% if mode == 'edit' %}保存改写{% else %}写入时间轴{% endif %}</button>
      <button type="button" class="btn ghost" onclick="closeDrawer()">取消</button>
    </div>
  </form>
</aside>
